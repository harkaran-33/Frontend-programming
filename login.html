<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPro | Authentication</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="index.html">StockPro</a>
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-light me-2">Home</a>
        <a href="market.html" class="btn btn-outline-light me-2">Market</a>
        <a href="portfolio.html" class="btn btn-outline-light me-2">Portfolio</a>
        <a href="pro.html" class="btn btn-outline-light me-2">Pro</a>
        <a href="login.html" class="btn btn-outline-success me-2">Login</a>
        <button id="themeToggle" class="btn btn-warning">🌙</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card-custom">
          <h2 class="mb-4 text-center fw-bold text-success">Sign In</h2>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" id="email" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 mt-2">Continue</button>
          </form>
          <div id="loginAlert" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">Frontend Programming Retake Exam Project • StockPro Dashboard</footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const alertBox = document.getElementById("loginAlert");

      try {
        const res = await fetch("api.php?action=login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.status === "success") {
          alertBox.innerHTML = `<div class="alert alert-success">Welcome ${data.user}! Logged in.</div>`;
          setTimeout(() => { window.location.href = "portfolio.html"; }, 1000);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (_) {
        alertBox.innerHTML = `<div class="alert alert-success">Demo mode: Sign in successful!</div>`;
        setTimeout(() => { window.location.href = "portfolio.html"; }, 1000);
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>

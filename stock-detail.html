<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPro | Apple Inc. Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="index.html">StockPro</a>
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-light me-2">Home</a>
        <a href="market.html" class="btn btn-outline-success me-2">Market</a>
        <a href="portfolio.html" class="btn btn-outline-light me-2">Portfolio</a>
        <a href="pro.html" class="btn btn-outline-light me-2">Pro</a>
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <button id="themeToggle" class="btn btn-warning">🌙</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="fw-bold">Apple Inc. (AAPL)</h1>
        <h3 class="text-success">+2.50% ($185.25)</h3>
      </div>
      <div>
        <button class="btn btn-success btn-lg me-2">BUY</button>
        <button class="btn btn-danger btn-lg">SELL</button>
      </div>
    </div>

    <div class="mb-3">
      <button class="btn btn-success me-2" onclick="changePeriod('1D')">1D</button>
      <button class="btn btn-outline-light me-2" onclick="changePeriod('1M')">1M</button>
      <button class="btn btn-outline-light me-2" onclick="changePeriod('3M')">3M</button>
      <button class="btn btn-outline-light me-2" onclick="changePeriod('1Y')">1Y</button>
    </div>

    <div class="card-custom mb-4">
      <canvas id="stockChart" height="110"></canvas>
    </div>

    <h3 class="mb-3 text-success">Key Metrics</h3>
    <div class="row">
      <div class="col-md-3 mb-3">
        <div class="card-custom text-center">
          <small class="text-secondary">Open</small>
          <h4>$184.10</h4>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card-custom text-center">
          <small class="text-secondary">Day High</small>
          <h4>$186.40</h4>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card-custom text-center">
          <small class="text-secondary">Day Low</small>
          <h4>$183.20</h4>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card-custom text-center">
          <small class="text-secondary">Volume</small>
          <h4>56.2M</h4>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">Frontend Programming Retake Exam Project • StockPro Dashboard</footer>

  <script>
    const chartData = {
      "1D": { labels: ["09:00", "11:00", "13:00", "15:00", "17:00"], values: [184.1, 185.0, 183.8, 186.2, 185.25] },
      "1M": { labels: ["W1", "W2", "W3", "W4"], values: [176.5, 179.0, 182.4, 185.25] },
      "3M": { labels: ["Jul", "Aug", "Sep"], values: [168.0, 174.5, 185.25] },
      "1Y": { labels: ["Q1", "Q2", "Q3", "Q4"], values: [152.0, 164.0, 172.5, 185.25] }
    };

    const ctx = document.getElementById('stockChart').getContext('2d');
    const stockChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData["1D"].labels,
        datasets: [{
          label: 'AAPL ($)',
          data: chartData["1D"].values,
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34, 197, 94, 0.15)',
          fill: true,
          tension: 0.35,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
        }
      }
    });

    function changePeriod(period) {
      if (!chartData[period]) return;
      stockChart.data.labels = chartData[period].labels;
      stockChart.data.datasets[0].data = chartData[period].values;
      stockChart.update();
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
